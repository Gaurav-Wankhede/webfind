{% extends "base.html" %}

{% block title %}WebFind — Search the Web{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-center px-4 -mt-16">
  <div class="text-center mb-10">
    <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-4">
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
        WebFind
      </span>
    </h1>
    <p class="text-slate-400 text-lg">Self-hosted search engine. No AI. Real research.</p>
  </div>

  <div class="w-full max-w-2xl">
    <form id="search-form" action="/web/search" method="get" class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <svg class="w-5 h-5 text-slate-500 group-focus-within:text-cyan-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input
        type="search"
        name="q"
        value="{{ query }}"
        placeholder="Search the web..."
        autocomplete="off"
        class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-full py-4 pl-12 pr-32 shadow-lg focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition placeholder-slate-500"
        hx-get="/api/web/suggest"
        hx-trigger="input changed delay:300ms, keyup[key=='Enter']"
        hx-target="#suggestions"
        hx-swap="outerHTML"
        hx-indicator="#suggest-indicator"
      >
      <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-2">
        <select name="max_pages" class="bg-slate-800 border border-slate-700 text-xs text-slate-300 rounded-full px-3 py-2 focus:outline-none focus:border-cyan-500">
          <option value="5">5 pages</option>
          <option value="10" selected>10 pages</option>
          <option value="20">20 pages</option>
          <option value="50">50 pages</option>
          <option value="100">100 pages</option>
        </select>
        <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-full px-5 py-2 transition">
          Research
        </button>
      </div>
    </form>

    <div class="mt-3 flex items-center justify-center gap-3">
      <input
        type="url"
        name="seed"
        value="{{ seed }}"
        placeholder="Optional seed URL (e.g. https://example.com)"
        autocomplete="off"
        class="w-full max-w-md bg-slate-900/50 border border-slate-800 text-slate-300 text-sm rounded-full py-2 px-4 focus:outline-none focus:border-cyan-500 transition placeholder-slate-600"
        form="search-form"
      >
    </div>

    <!-- Suggestions dropdown -->
    <div id="suggestions" class="relative max-w-2xl mx-auto"></div>
    <div id="suggest-indicator" class="htmx-indicator hidden text-center mt-2">
      <span class="text-slate-500 text-sm">Loading suggestions...</span>
    </div>
  </div>

  <p class="mt-6 text-sm text-slate-500">
    Every search researches the live web and builds the knowledge graph in the background.
  </p>
</div>
{% endblock %}
