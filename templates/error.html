{% extends "base.html" %}

{% block title %}Error — WebFind{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-center px-4">
  <div class="text-center max-w-lg">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/10 text-red-400 mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">Something went wrong</h1>
    <p class="text-slate-400 mb-6">{{ message }}</p>
    <a href="/" class="inline-block bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-full px-6 py-2.5 transition">
      Go home
    </a>
  </div>
</div>
{% endblock %}
