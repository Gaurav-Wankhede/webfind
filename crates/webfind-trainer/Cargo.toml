[package]
name = "webfind-trainer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Pure-Rust Burn training harness for WebFind routing and distillation models"
license = "MIT"

[dependencies]
webfind-models = { path = "../webfind-models" }
burn = { version = "0.21", features = ["train", "wgpu", "autodiff"] }
burn-wgpu = "0.21"
burn-autodiff = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
smallvec = { version = "1", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }




