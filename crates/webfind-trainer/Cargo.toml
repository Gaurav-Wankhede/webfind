[package]
name = "webfind-trainer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Pure-Rust Burn training harness for WebFind routing and distillation models"
license = "MIT"

[dependencies]
webfind-models = { path = "../webfind-models" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

