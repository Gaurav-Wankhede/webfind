[package]
name = "webfind-models"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Type-safe decision tensors and distilled metadata schemas for WebFind"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
