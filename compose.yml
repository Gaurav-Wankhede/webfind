# WebFind — single-container deployment.
#
# WebFind is fully self-contained: it embeds Turso/libSQL (SQLite) for the link
# graph + vector + BM25 storage. No SurrealDB, no separate database container,
# no schema-init step — the database schema is created automatically on first run.
#
# Host port mappings:
#   5748 -> 4747 : API / MCP over HTTP (Streamable HTTP)
#   5750 -> 4749 : HTML GUI (Google-style search)
#
#   Access the GUI from your host at: http://localhost:5750
#   Access the API from your host at: http://localhost:5748

services:
  webfind:
    build: .
    image: webfind:latest
    container_name: webfind-server
    ports:
      - "5748:4747"
      - "5750:4749"
    environment:
      # Data dir holds the Turso DB file, Tantivy index, and cache.
      WEBFIND_DATA_DIR: /data
      # Embedded Turso graph store (single-file SQLite). "memory" is the in-memory fallback.
      WEBFIND_GRAPH_STORE: turso
      # Path to the Turso database file inside the data dir.
      WEBFIND_TURSO_PATH: /data/webfind.db
      # Optional: SQLCipher encryption-at-rest via config file (turso.encryption_key).
      # Optional OAuth 2.1 + PKCE (default off — single-tenant).
      # WEBFIND_AUTH_MODE: off
      # Hardening (see README §Environment Variables).
      WEBFIND_RATE_LIMIT: "60"
      WEBFIND_MCP_ALLOWED_HOSTS: localhost
    volumes:
      - webfind-data:/data
    command: ["serve", "--transport", "http", "--gui-port", "4749"]
    restart: unless-stopped

volumes:
  webfind-data:
