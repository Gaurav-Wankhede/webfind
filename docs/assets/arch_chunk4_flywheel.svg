    <text x="0" y="-12" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">BURN // WGPU</text>
    <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="900">M4 TRAINER</text>
    <text x="0" y="25" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="10">Apple Silicon</text>
    <text x="0" y="40" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">&lt; 45 Seconds</text>
  </g>

  <!-- DATA SOURCE 1: PHYSICAL TELEMETRY (TOP LEFT) -->
  <g transform="translate(240, 160)">
    <circle r="44" fill="#050B18" stroke="#00F0FF" stroke-width="1.5" />
    <text x="0" y="-10" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="9" font-weight="800">SOURCE 01</text>
    <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">webfind.db</text>
    <text x="0" y="24" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9">Crawl Truths</text>
  </g>
  <path d="M284 160 L540 230" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />

  <!-- DATA SOURCE 2: BEIR/MS-MARCO (BOTTOM LEFT) -->
  <g transform="translate(240, 320)">
    <circle r="44" fill="#050B18" stroke="#00F0FF" stroke-width="1.5" />
    <text x="0" y="-10" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="9" font-weight="800">SOURCE 02</text>
    <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">BEIR // MARCO</text>
    <text x="0" y="24" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9">Passage Saliency</text>
  </g>
