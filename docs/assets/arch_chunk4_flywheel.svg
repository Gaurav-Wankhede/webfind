<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#050C16" />
    </linearGradient>
    <linearGradient id="glowLine4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bgGrad4)" />

  <!-- GRID MATRIX -->
  <g opacity="0.08">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200" stroke="#00F0FF" stroke-width="0.5" />
    <path d="M120 0 V480 M240 0 V480 M360 0 V480 M480 0 V480 M600 0 V480 M720 0 V480 M840 0 V480 M960 0 V480 M1080 0 V480" stroke="#00F0FF" stroke-width="0.5" />
  </g>

  <!-- TITLE BADGE -->
  <text x="60" y="55" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CHUNK 04 // PURE-RUST DATA &amp; TRAINING FLYWHEEL</text>
  <text x="60" y="82" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">ZERO-PYTHON M4 METAL TRAINING PIPELINE</text>

  <!-- FLYWHEEL LOOP CENTRAL HUB -->
  <g transform="translate(600, 240)">
