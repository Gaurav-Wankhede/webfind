    <text x="0" y="-10" text-anchor="middle" fill="#FF007A" font-family="-apple-system, sans-serif" font-size="9" font-weight="800">SOURCE 04</text>
    <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">ADVERSARIAL</text>
    <text x="0" y="24" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9">Caveat Perturbation</text>
  </g>
  <path d="M916 320 L660 250" stroke="#FF007A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />

  <!-- DEPLOYMENT ARTIFACT -->
  <g transform="translate(600, 420)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#050B18" stroke="#00F0FF" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">
