    <text x="0" y="-10" text-anchor="middle" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="9" font-weight="800">SOURCE 03</text>
    <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">DISTILLATION</text>
    <text x="0" y="24" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9">System 2 Teacher</text>
  </g>
  <path d="M916 160 L660 230" stroke="#7000FF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />

  <!-- DATA SOURCE 4: ADVERSARIAL GENERATION (BOTTOM RIGHT) -->
  <g transform="translate(960, 320)">
