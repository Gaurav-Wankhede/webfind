<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- High-contrast dark backdrop -->
  <rect width="32" height="32" rx="7" fill="#090D16"/>

  <!-- CLI Chevron '>' -->
  <path d="M 7 10 L 13 16 L 7 22" 
        fill="none" 
        stroke="#00F0FF" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Search Lens Circle -->
  <circle cx="20" cy="15" r="5.5" 
          fill="none" 
          stroke="#F8FAFC" 
          stroke-width="2.5"/>

  <!-- Lens Handle -->
  <line x1="24" y1="19" x2="27" y2="22" 
        stroke="#F8FAFC" 
        stroke-width="2.5" 
        stroke-linecap="round"/>

  <!-- Central Target Ping -->
  <circle cx="20" cy="15" r="1.5" fill="#00F0FF"/>
</svg>
