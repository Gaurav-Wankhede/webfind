<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="amberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Box Fill Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.25"/>
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 14px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 11px; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; fill: #38bdf8; font-size: 10px; }
    .node-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 13px; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 11px; }
    .wire { stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-dashed { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGlow)"/>
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- ================= SECTION 1: CLIENTS & CONSUMERS ================= -->
  <g transform="translate(40, 30)">
    <!-- Outer Container -->
    <rect width="880" height="90" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="24" class="title">CLIENTS &amp; CONSUMERS</text>
    <rect x="730" y="10" width="130" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="795" y="24" text-anchor="middle" class="badge-text">AGENT &amp; USER TIER</text>

    <!-- Subcard: AI Agent -->
    <g transform="translate(24, 34)">
      <rect width="400" height="44" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glowCyan)"/>
      <circle cx="24" cy="22" r="10" fill="#0369a1"/>
      <path d="M 18 22 L 30 22 M 24 16 L 24 28" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="44" y="21" class="node-header">AI Agent Harness</text>
      <text x="44" y="34" class="node-desc">Pure CLI · System Prompt · Zero-MCP · JSON IPC</text>
    </g>

    <!-- Subcard: Human Web UI -->
    <g transform="translate(456, 34)">
      <rect width="400" height="44" rx="8" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.2" filter="url(#glowPurple)"/>
      <circle cx="24" cy="22" r="10" fill="#6b21a8"/>
      <rect x="18" y="16" width="12" height="12" rx="2" fill="none" stroke="#d8b4fe" stroke-width="1.5"/>
      <text x="44" y="21" class="node-header">Human Web Interface</text>
      <text x="44" y="34" class="node-desc">Axum · HTMX · Tailwind CSS · Live SSE Stream</text>
    </g>
  </g>

  <!-- Connection Rails -->
  <!-- Agent to Engine -->
  <path d="M 264 120 L 264 175" class="wire" marker-end="url(#arrow)"/>
  <rect x="185" y="138" width="160" height="18" rx="4" fill="#020617" stroke="#0284c7" stroke-width="1"/>
  <text x="265" y="150" text-anchor="middle" class="badge-text">webfind research --output</text>

  <!-- Web UI to Engine -->
  <path d="M 696 120 L 696 175" class="wire" marker-end="url(#arrow)"/>
  <rect x="635" y="138" width="122" height="18" rx="4" fill="#020617" stroke="#a855f7" stroke-width="1"/>
  <text x="696" y="150" text-anchor="middle" class="badge-text" fill="#c084fc">GET / HTTP &amp; SSE</text>

  <!-- ================= SECTION 2: WEBFIND CORE ENGINE ================= -->
  <g transform="translate(40, 180)">
    <rect width="880" height="305" rx="12" fill="#0b1120" stroke="#0284c7" stroke-width="1.5"/>
    <text x="24" y="26" class="title">WEBFIND ENGINE (RUST RUNTIME)</text>
    <rect x="700" y="12" width="160" height="20" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="780" y="25" text-anchor="middle" class="badge-text">HIGH CONCURRENCY TOKIO</text>

    <!-- Row 1: Ingestion Components -->
    <!-- Crawler Engine -->
    <g transform="translate(24, 42)">
      <rect width="265" height="52" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" class="node-header">Crawler Engine</text>
      <text x="14" y="38" class="node-desc">robots.txt · Delays · Session Affinity</text>
    </g>

    <!-- Headless Browser -->
    <g transform="translate(307, 42)">
      <rect width="265" height="52" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" class="node-header">Headless Browser (CDP)</text>
      <text x="14" y="38" class="node-desc">Chromium · JS SPAs · Stealth Scroll</text>
    </g>

    <!-- Proxy Pool -->
    <g transform="translate(590, 42)">
      <rect width="266" height="52" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" class="node-header">Resilient Proxy Pool</text>
      <text x="14" y="38" class="node-desc">CIDR Rotation · SOCKS5 / HTTP</text>
    </g>

    <!-- Connectors Row 1 to Row 2 -->
    <path d="M 156 94 L 156 122" class="wire" marker-end="url(#arrow)"/>
    <path d="M 440 94 L 440 122" class="wire" marker-end="url(#arrow)"/>
    <path d="M 723 94 L 723 110 L 460 110 L 460 122" class="wire-dashed"/>

    <!-- Row 2: Indexer Layer -->
    <g transform="translate(24, 126)">
      <rect width="832" height="48" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1"/>
      <text x="20" y="20" class="node-header">Parallel Indexer Pipeline</text>
      <text x="20" y="36" class="node-desc">Lexical Tokenization (BM25) + Local Dense Embeddings (FastEmbed-rs / BAAI-bge-small)</text>
    </g>

    <!-- Connector Row 2 to Row 3 -->
    <path d="M 440 174 L 440 196" class="wire" marker-end="url(#arrow)"/>

    <!-- Row 3: Hybrid Ranker & Scorer -->
    <g transform="translate(24, 200)">
      <rect width="832" height="46" rx="8" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1"/>
      <text x="20" y="19" class="node-header">Hybrid Ranker &amp; Scorer (RRF Fusion)</text>
      <text x="20" y="34" class="node-desc">Reciprocal Rank Fusion · BM25 Score + Vector Cosine Distance + PageRank Authority</text>
    </g>

    <!-- Connector Row 3 to Row 4 -->
    <path d="M 440 246 L 440 262" class="wire" marker-end="url(#arrow-emerald)"/>

    <!-- Row 4: Turso / libSQL Store -->
    <g transform="translate(24, 264)">
      <rect width="832" height="34" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2" filter="url(#glowEmerald)"/>
      <text x="20" y="21" class="node-header" fill="#34d399">Embedded Turso / libSQL Store (webfind.db)</text>
      <text x="350" y="21" class="node-desc" fill="#a7f3d0">Tables: url_nodes · link_edges · page_content · FTS5 Index · DiskANN Vector Index · PageRank Graph</text>
    </g>
  </g>
</svg>
