<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 110" width="100%" height="110">
  <defs>
    <!-- Professional Linux Distribution / System Gradients -->
    <linearGradient id="sysGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="softElevation" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .brand-primary {
      font-family: "Liberation Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 54px;
      font-weight: 300;
      letter-spacing: -0.5px;
      fill: #f1f5f9;
    }
    .brand-accent {
      font-family: "Liberation Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: -0.5px;
      fill: url(#accentCyan);
    }
    .system-desc {
      font-family: "Liberation Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.3px;
      fill: #94a3b8;
    }
    .pill-badge {
      font-family: "Liberation Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #38bdf8;
    }
  </style>

  <g filter="url(#softElevation)" transform="translate(60, 12)">
    <!-- ================= MINIMALIST LINUX-STYLE SYSTEM EMBLEM ================= -->
    <g transform="translate(10, 8)">
      <!-- Outer Solid Ring -->
      <circle cx="36" cy="36" r="34" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
      
      <!-- Precision Concentric System Orbit -->
      <circle cx="36" cy="36" r="26" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
      
      <!-- Graph Core Triad -->
      <line x1="26" y1="28" x2="46" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="28" x2="34" y2="48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="46" y1="24" x2="34" y2="48" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

      <circle cx="26" cy="28" r="4.5" fill="#38bdf8"/>
      <circle cx="46" cy="24" r="4" fill="#60a5fa"/>
      <circle cx="34" cy="48" r="5" fill="#0284c7"/>

      <!-- Clean Search Node Probe -->
      <path d="M 52 52 L 68 68" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- ================= PROFESSIONAL LINUX TYPOGRAPHY ================= -->
    <g transform="translate(106, 12)">
      <!-- Name: Lightweight Web + Bold Find (Linux Foundation / Red Hat / Canonical Style) -->
      <text x="0" y="48">
        <tspan class="brand-primary">web</tspan><tspan class="brand-accent">find</tspan>
      </text>

      <!-- System Architecture Pill -->
      <g transform="translate(236, 26)">
        <rect width="84" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
        <text x="42" y="14" text-anchor="middle" class="pill-badge">SYSTEM</text>
      </g>
      <g transform="translate(328, 26)">
        <rect width="66" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="33" y="14" text-anchor="middle" class="pill-badge" fill="#94a3b8">v0.3.0</text>
      </g>

      <!-- Subtitle -->
      <text x="2" y="74" class="system-desc">
        High-Performance Web Research &amp; Graph Engine for Autonomous Systems
      </text>
    </g>
  </g>
</svg>
