<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="purpleLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="1" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- GRID MATRIX -->
  <g opacity="0.08">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200" stroke="#00F0FF" stroke-width="0.5" />
    <path d="M120 0 V480 M240 0 V480 M360 0 V480 M480 0 V480 M600 0 V480 M720 0 V480 M840 0 V480 M960 0 V480 M1080 0 V480" stroke="#00F0FF" stroke-width="0.5" />
  </g>

  <!-- TITLE BADGE -->
  <text x="60" y="55" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CHUNK 01 // TWO-STAGE DUAL MODEL TOPOLOGY</text>
  <text x="60" y="82" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">JEV SYSTEM-1 &amp; TOKEN DISTILLER PIPELINE</text>

  <!-- CONDUIT RAILS -->
  <path d="M180 240 H360" stroke="url(#cyanLaser)" stroke-width="3" filter="url(#laserGlow)" />
  <path d="M560 240 H740" stroke="url(#cyanLaser)" stroke-width="3" filter="url(#laserGlow)" />
  <path d="M940 240 H1060" stroke="url(#purpleLaser)" stroke-width="3" filter="url(#laserGlow)" />

  <!-- PHOTON PULSES -->
  <circle cx="270" cy="240" r="4" fill="#FFFFFF" filter="url(#laserGlow)" />
  <circle cx="650" cy="240" r="4" fill="#FFFFFF" filter="url(#laserGlow)" />
  <circle cx="1000" cy="240" r="4" fill="#FF007A" filter="url(#laserGlow)" />

  <!-- NODE 1: INGRESS STREAM -->
  <g transform="translate(100, 240)">
    <circle r="42" fill="#000000" stroke="#00F0FF" stroke-width="2" filter="url(#laserGlow)" />
    <circle r="34" fill="#050B1A" stroke="#00F0FF" stroke-dasharray="4 3" stroke-width="1" />
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">RAW WEB</text>
    <text x="0" y="12" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">INGRESS</text>
    <text x="0" y="65" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">HTML / Queries</text>
  </g>

  <!-- NODE 2: STAGE 1 (JEV CLASSIFIER) -->
  <g transform="translate(460, 240)">
    <polygon points="0,-65 90,0 0,65 -90,0" fill="#030712" stroke="#00F0FF" stroke-width="2.5" filter="url(#laserGlow)" />
    <circle r="22" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1" />
    <text x="0" y="-12" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">MODEL 01</text>
    <text x="0" y="6" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="900">JEV SYSTEM-1</text>
    <text x="0" y="22" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">ROUTER // 1.5M</text>
    
    <!-- SUB-BADGES -->
    <text x="0" y="95" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Protocol &amp; Noise Filter</text>
    <text x="0" y="112" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">&lt; 1.5ms Latency</text>
  </g>

  <!-- NODE 3: STAGE 2 (TOKEN DISTILLER) -->
  <g transform="translate(840, 240)">
    <polygon points="0,-65 90,0 0,65 -90,0" fill="#030712" stroke="#7000FF" stroke-width="2.5" filter="url(#laserGlow)" />
    <circle r="22" fill="#7000FF" fill-opacity="0.1" stroke="#7000FF" stroke-width="1" />
    <text x="0" y="-12" text-anchor="middle" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">MODEL 02</text>
    <text x="0" y="6" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="900">DISTILLER</text>
    <text x="0" y="22" text-anchor="middle" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">ENCODER // 22M</text>

    <!-- SUB-BADGES -->
    <text x="0" y="95" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Span &amp; Metric Extractor</text>
    <text x="0" y="112" text-anchor="middle" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">350 Clean Tokens</text>
  </g>

  <!-- NODE 4: FRONTIER LLM -->
  <g transform="translate(1110, 240)">
    <circle r="46" fill="#000000" stroke="#FF007A" stroke-width="2.5" filter="url(#laserGlow)" />
    <circle r="38" fill="#1A000D" stroke="#FF007A" stroke-dasharray="3 3" stroke-width="1" />
    <text x="0" y="-6" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">FRONTIER</text>
    <text x="0" y="10" text-anchor="middle" fill="#FF007A" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">LLM</text>
    <text x="0" y="70" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Zero Context Rot</text>
  </g>

  <!-- EFFICIENCY GAIN METRIC CARD -->
  <g transform="translate(480, 420)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#050B18" stroke="#00F0FF" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">96% TOKEN REDUCTION // 0% TYPE ERROR</text>
  </g>
</svg>
