<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bgGrad2)" />

  <!-- GRID MATRIX -->
  <g opacity="0.08">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200" stroke="#00F0FF" stroke-width="0.5" />
    <path d="M120 0 V480 M240 0 V480 M360 0 V480 M480 0 V480 M600 0 V480 M720 0 V480 M840 0 V480 M960 0 V480 M1080 0 V480" stroke="#00F0FF" stroke-width="0.5" />
  </g>

  <!-- TITLE BADGE -->
  <text x="60" y="55" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CHUNK 02 // STAGE 1 ROUTING &amp; BOOLEAN MANIFEST TENSOR</text>
  <text x="60" y="82" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">JEV SYSTEM-1 MULTI-HEAD ROUTING GATE</text>

  <!-- BUS RAIL -->
  <path d="M150 240 H380" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow2)" />
  
  <!-- FAN OUT CONDUITS -->
  <path d="M520 240 L700 130 H860" stroke="#00F0FF" stroke-width="2" filter="url(#glow2)" fill="none" />
  <path d="M520 240 L700 200 H860" stroke="#00F0FF" stroke-width="2" filter="url(#glow2)" fill="none" />
  <path d="M520 240 L700 280 H860" stroke="#FF007A" stroke-width="2" filter="url(#glow2)" fill="none" />
  <path d="M520 240 L700 350 H860" stroke="#7000FF" stroke-width="2" filter="url(#glow2)" fill="none" />

  <!-- INPUT TENSOR -->
  <g transform="translate(100, 240)">
    <circle r="36" fill="#050B18" stroke="#00F0FF" stroke-width="2" />
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">CANDIDATE</text>
    <text x="0" y="12" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">URL // DOM</text>
    <text x="0" y="58" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Fastembed 384d</text>
  </g>

  <!-- FEATURE FUSION BOX -->
  <g transform="translate(260, 240)">
    <rect x="-65" y="-40" width="130" height="80" rx="6" fill="#040814" stroke="#00F0FF" stroke-width="1.5" />
    <text x="0" y="-18" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">BOOLEAN TENSOR</text>
    <text x="-50" y="2" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">• llms-full.txt</text>
    <text x="-50" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">• llms.txt</text>
    <text x="-50" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">• ai-catalog.json</text>
  </g>

  <!-- JEV CORE MLP -->
  <g transform="translate(450, 240)">
    <polygon points="0,-55 70,0 0,55 -70,0" fill="#060D1E" stroke="#00F0FF" stroke-width="2" filter="url(#glow2)" />
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">JEV MLP</text>
    <text x="0" y="10" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">1.5M PARAMS</text>
    <text x="0" y="24" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Pure-Rust</text>
  </g>

  <!-- OUTPUT ROUTING HEAD 1: MANIFEST -->
  <g transform="translate(930, 130)">
    <rect x="-60" y="-22" width="160" height="44" rx="22" fill="#040914" stroke="#00F0FF" stroke-width="1.5" />
    <text x="20" y="-2" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">MANIFEST FAST-PATH</text>
    <text x="20" y="12" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Zero HTML // Raw Markdown</text>
  </g>

  <!-- OUTPUT ROUTING HEAD 2: STATIC HTTP -->
  <g transform="translate(930, 200)">
    <rect x="-60" y="-22" width="160" height="44" rx="22" fill="#040914" stroke="#00F0FF" stroke-width="1.5" />
    <text x="20" y="-2" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">STATIC HTTP GET</text>
    <text x="20" y="12" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Reqwest &lt;80ms</text>
  </g>

  <!-- OUTPUT ROUTING HEAD 3: CDP BROWSER -->
  <g transform="translate(930, 280)">
    <rect x="-60" y="-22" width="160" height="44" rx="22" fill="#040914" stroke="#FF007A" stroke-width="1.5" />
    <text x="20" y="-2" text-anchor="middle" fill="#FF007A" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">HEADLESS CDP</text>
    <text x="20" y="12" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Chromium Dynamic JS</text>
  </g>

  <!-- OUTPUT ROUTING HEAD 4: TERMINATE EARLY -->
  <g transform="translate(930, 350)">
    <rect x="-60" y="-22" width="160" height="44" rx="22" fill="#040914" stroke="#7000FF" stroke-width="1.5" />
    <text x="20" y="-2" text-anchor="middle" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">TERMINATE EARLY</text>
    <text x="20" y="12" text-anchor="middle" fill="#8E9AA8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Answer Confidence &gt;= 0.95</text>
  </g>
</svg>
