<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="200" rx="16" fill="url(#bgBanner)"/>
  <rect width="798" height="198" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Terminal Grid Lines -->
  <path d="M 50 150 L 750 150" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Integrated Logo Mark (Icon) -->
  <g transform="translate(60, 48)">
    <rect width="104" height="104" rx="22" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
    <!-- Chevron -->
    <path d="M 28 36 L 44 52 L 28 68" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Radar / Lens -->
    <circle cx="66" cy="49" r="17" 
            fill="none" 
            stroke="#F8FAFC" 
            stroke-width="5.5" 
            stroke-linecap="round"/>
    <!-- Handle -->
    <line x1="78" y1="61" x2="88" y2="71" 
          stroke="#F8FAFC" 
          stroke-width="5.5" 
          stroke-linecap="round"/>
    <!-- Focal Point -->
    <circle cx="66" cy="49" r="3.5" fill="#00F0FF"/>
  </g>

  <!-- Wordmark & Tagline -->
  <!-- Wordmark -->
  <text x="195" y="108" 
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="-1" 
        fill="#F8FAFC">
    web<tspan fill="#00F0FF">find</tspan><tspan fill="#38BDF8">_</tspan>
  </text>

  <!-- Tagline -->
  <text x="198" y="140" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="16" 
        font-weight="500" 
        letter-spacing="0.5" 
        fill="#94A3B8">
    CLI Agentic Web Search for Harness Systems · No MCP Overhead
  </text>
</svg>
